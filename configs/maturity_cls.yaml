# Baseline: linear probe on frozen DINOv2-small crop embeddings (scripts/train_maturity.py).
task: maturity_cls
dataset: maturity_cls_v0.5          # gold release under data/gold/ (scripts/build_gold.py)
classes: [unripe, ripe, overripe]   # ordinal; overripe comes from human-reviewed candidates

model:
  backbone: facebook/dinov2-small   # Apache-2.0; embeddings cached per crop
  head: logistic_regression         # class-balanced, standardised features
  c: 1.0

holdout_sources: [kamat_2025, owner_phone_2026]   # ADR 0007 proxy; owner photos teach a size shortcut (finding #19), so they score maturity only
calibration: temperature            # temperature | none. T is fitted on gold val only (ADR 0005 B3)
seed: 42

eval:
  bootstrap_resamples: 2000         # intervals resample groups (images / photos)
